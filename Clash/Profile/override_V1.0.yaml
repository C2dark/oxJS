# ==============================
# 0. 全局配置模板 (定义锚点)
# ==============================
common-config:
  # 模板1: 时延优选 (自动选择)
  - &auto
    type: url-test
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50
    lazy: true
    expected-status: 204
    hidden: true
    include-all: true
  
  # 模板2: 故障转移
  - &fallback
    type: fallback
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    lazy: true
    expected-status: 204
    hidden: true
    include-all: true

  # 模板3: 负载均衡
  - &lb
    type: load-balance
    strategy: consistent-hashing
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    lazy: true
    expected-status: 204
    hidden: true
    include-all: true

  # 规则集模板: 经典模式、YAML格式、一天一更
  - &p-standard
    type: http
    behavior: classical
    format: yaml
    interval: 86400

