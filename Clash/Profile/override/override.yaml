# ==============================
# 0. 全局配置模板 (定义锚点)
# ==============================
common-config:
  # 模板1: 时延优选 (自动选择)
  - &auto
    type: url-test
    url: 'http://www.gstatic.com/generate_204'
    interval: 600
    tolerance: 50
    timeout: 5000
    lazy: true
    expected-status: 204
    hidden: true
    include-all: true
  
  # 模板2: 故障转移
  - &fallback
    type: fallback
    url: 'http://www.gstatic.com/generate_204'
    interval: 600
    timeout: 3000
    lazy: true
    expected-status: 204
    hidden: true
    include-all: true

  # 模板3: 负载均衡
  - &lb
    type: load-balance
    strategy: consistent-hashing  #round-robin (轮询/极速模式)第1个请求走节点A，第2个走节点B。consistent-hashing对目标域名（如 google.com）进行哈希计算。只要你访问的是 google.com，它就固定分配给节点 A。
    url: 'http://www.gstatic.com/generate_204'
    interval: 600
    timeout: 5000
    lazy: true
    expected-status: 204
    hidden: true
    include-all: true

  # 规则集模板1: 经典模式、YAML格式、一天一更
  - &p-standard
    type: http
    behavior: classical
    format: yaml
    interval: 86400
  # 规则集模板2: IPCIDR 模式、YAML格式、一天一更
  - &p-ip
    type: http
    behavior: ipcidr
    format: yaml
    interval: 86400
# 规则集模板3.1: MRS domain二进制格式
  - &p-mrs
    type: http
    format: mrs
    interval: 86400
    behavior: domain
# 规则集模板3.2: MRS ipcidr 二进制格式
  - &p-mrsip
    type: http
    format: mrs
    interval: 86400
    behavior: ipcidr 
