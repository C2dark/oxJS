  - RULE-SET,AdBlock,REJECT,no-resolve
  - RULE-SET,Hijacking,REJECT,no-resolve
  - RULE-SET,Privacy,REJECT,no-resolve
  - RULE-SET,BlockHttpDNS,REJECT,no-resolve

  # 2. 局域网直连
