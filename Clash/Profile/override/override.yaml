#version: override_V4.1_cdn_accurate
#date: 2026.10.09
#describe: 精准 CDN 加速版（严格按各规则集与图标原本所属的真实仓库映射 jsDelivr，保留非 GitHub 自建链接）

# ==============================
# 0. 全局配置模板 (定义锚点)
# ==============================
common-config:
  # 模板1: 时延优选 (自动选择)
  - &auto
    type: url-test
    url: 'http://www.gstatic.com/generate_204'
    interval: 600
    tolerance: 50
    timeout: 5000
    lazy: true
    expected-status: 204
    hidden: true
    include-all: true

  # 模板2: 故障转移
  - &fallback
    type: fallback
    url: 'http://www.gstatic.com/generate_204'
    interval: 600
    timeout: 3000
    lazy: true
    expected-status: 204
    hidden: true
    include-all: true

  # 模板3: 负载均衡
  - &lb
    type: load-balance
    strategy: consistent-hashing
    url: 'http://www.gstatic.com/generate_204'
    interval: 600
    timeout: 5000
    lazy: true
    expected-status: 204
    hidden: true
    include-all: true

  # 规则集模板1: 经典模式、YAML格式
  - &p-standard
    type: http
    behavior: classical
    format: yaml
    interval: 86400

  # 规则集模板2: IPCIDR 模式、YAML格式
  - &p-ip
    type: http
    behavior: ipcidr
    format: yaml
    interval: 86400

  # 规则集模板3.1: MRS domain 二进制格式
  - &p-mrs
    type: http
    format: mrs
    interval: 86400
    behavior: domain

  # 规则集模板3.2: MRS ipcidr 二进制格式
  - &p-mrsip
    type: http
    format: mrs
    interval: 86400
    behavior: ipcidr

