#version: override_mrs_V1.0
#date: 2026.10.09
# ==============================
# 0. 全局配置模板 (定义锚点)
# ==============================
common-config:
  # 模板1: 时延优选 (自动选择)
  - &auto
    type: url-test
    url: 'http://www.gstatic.com/generate_204'
    interval: 600
    tolerance: 50
    timeout: 5000
    lazy: true
    expected-status: 204
    hidden: true
    include-all: true

  # 模板2: 故障转移
  - &fallback
    type: fallback
    url: 'http://www.gstatic.com/generate_204'
    interval: 600
    timeout: 3000
    lazy: true
    expected-status: 204
    hidden: true
    include-all: true

  # 模板3: 负载均衡
  - &lb
    type: load-balance
    strategy: consistent-hashing
    url: 'http://www.gstatic.com/generate_204'
    interval: 600
    timeout: 5000
    lazy: true
    expected-status: 204
    hidden: true
    include-all: true

  # 规则集模板: MRS 域名二进制格式 (Domain Behavior)
  - &p-mrs
    type: http
    format: mrs
    behavior: domain
    interval: 86400

  # 规则集模板: MRS IP 二进制格式 (IPCIDR Behavior)
  - &p-mrsip
    type: http
    format: mrs
    behavior: ipcidr
    interval: 86400

