  - {name: Facebook,   type: select, proxies: [手动切换, 美国策略, 香港策略, 狮城策略, 日本策略, 台湾策略], icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Facebook.png }
  - {name: Google, type: select, proxies: [手动切换, 美国策略, 香港策略, 狮城策略, 日本策略, 台湾策略], icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Google.png }
