  # 全局时延优选 (独立存在)
  - {name: 时延优选, type: url-test, include-all: true, url: 'http://www.gstatic.com/generate_204', interval: 600, tolerance: 50, lazy: true, expected-status: 204, icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Urltest.png }


# ==============================
# 2. 地区策略主分组 (手动选择)
# ==============================
  - {name: 美国策略, type: select, proxies: [美国-时延优选, 美国-故障转移, 美国-负载均衡], include-all: true, filter: "美|US|(?i)States|American", icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/US.png }
  - {name: 香港策略, type: select, proxies: [香港-时延优选, 香港-故障转移, 香港-负载均衡], include-all: true, filter: "港|HK|(?i)Hong", icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/HK.png }
  - {name: 狮城策略, type: select, proxies: [狮城-时延优选, 狮城-故障转移, 狮城-负载均衡], include-all: true, filter: "新|坡|SG|(?i)Singapore", icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/SG.png }
  - {name: 日本策略, type: select, proxies: [日本-时延优选, 日本-故障转移, 日本-负载均衡], include-all: true, filter: "日|东京|JP|(?i)Japan", icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/JP.png }
  - {name: 台湾策略, type: select, proxies: [台湾-时延优选, 台湾-故障转移, 台湾-负载均衡], include-all: true, filter: "台|湾|TW|(?i)Taiwan", icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/TW.png }


# ==============================
# 3. 地区策略子分组 (隐藏式 Hidden)
# ==============================
  # --- 美国 ---
  - {name: 美国-时延优选, type: url-test, url: 'http://www.gstatic.com/generate_204', interval: 300, tolerance: 50, lazy: true, expected-status: 204, hidden: true, include-all: true, filter: "美|US|(?i)States|American", icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Urltest.png }
  - {name: 美国-故障转移, type: fallback, url: 'http://www.gstatic.com/generate_204', interval: 300, lazy: true, expected-status: 204, hidden: true, include-all: true, filter: "美|US|(?i)States|American", icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Available.png }
  - {name: 美国-负载均衡, type: load-balance, strategy: consistent-hashing, url: 'http://www.gstatic.com/generate_204', interval: 300, lazy: true, expected-status: 204, hidden: true, include-all: true, filter: "美|US|(?i)States|American", icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Round_Robin.png }

