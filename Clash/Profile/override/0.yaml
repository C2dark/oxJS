# ==============================
# 分流规则
# ==============================
rules:
  # 1. 广告拦截
  - RULE-SET,AdBlock,AdBlock
  
  # 2. 直连/局域网
  - RULE-SET,Lan,DIRECT
  - RULE-SET,Direct,DIRECT
  
  # 3. 国内高频应用 (直连优先)
  - RULE-SET,WeChat,DIRECT
  - RULE-SET,BiliBili,DIRECT
  - RULE-SET,Game,DIRECT
  - RULE-SET,Download,DIRECT
  
  # 4. 特殊/国外应用
  - RULE-SET,Speedtest,DIRECT
  - RULE-SET,PayPal,DIRECT
  - RULE-SET,AI,美国策略
  - RULE-SET,Imgur,香港策略
  - RULE-SET,Telegram,Telegram
  - RULE-SET,YouTube,YouTube
  - RULE-SET,TikTok,TikTok
  - RULE-SET,Facebook,Facebook
  - RULE-SET,Microsoft,Microsoft
  - RULE-SET,Bing,Bing
  - RULE-SET,Google,Google
  - RULE-SET,Apple,Apple
  - RULE-SET,Emby,Emby
  - RULE-SET,Netflix,Netflix
  - RULE-SET,OneDrive,GlobalDL
  - RULE-SET,GoogleDrive,GlobalDL
  - RULE-SET,PikPak,GlobalDL
  
  # 5. 通用/兜底
  - RULE-SET,Proxy,Global
  - RULE-SET,Global,Global
  - RULE-SET,GlobalMedia,Global
  
  # 6. 国内兜底
  - RULE-SET,ChinaMedia,DIRECT
  - RULE-SET,ChinaASN,DIRECT
  - RULE-SET,ChinaIP,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,兜底分流


# ==============================
# 3. 规则集定义 (无锚点，全展开)
