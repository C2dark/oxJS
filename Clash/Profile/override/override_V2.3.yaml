#override_V2.3
#2026.01.17 更新
# --- 1. 基础全局设置 (补全) ---
port: 5090
socks-port: 5091
mixed-port: 5092
allow-lan: true
mode: rule
log-level: info
ipv6: true
external-controller: 127.0.0.1:9090
secret: ""
profile:
  store-selected: true
  store-fake-ip: true
tcp-concurrent: true
unified-delay: true

# --- 2. Geodata 源 (保证 GEOSITE/GEOIP 可用) ---
geodata-mode: true
geox-url:
  geoip: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  asn: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"

# --- 3. DNS 设置 (优化) ---
dns:
  enable: true
  listen: :1053        # <--- 建议添加这行 (冒号前面留空代表 0.0.0.0)
  prefer-h3: true
  ipv6: true      #如网络环境不支持IPv6请设为false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:     #使用geosite域名集合以精简配置，也可使用规则集（ruleset）
    - geosite:private
    - geosite:category-ntp
    - "+.lan"
    - "+.local"
  # 新增：防止 Windows 网络探测误报
    - "dns.msftncsi.com"
    - "www.msftncsi.com"
    - "www.msftconnecttest.com"
  # --- [新增] STUN 服务 (关键优化) ---
    # 作用：让 Discord、Telegram 语音、WebRTC、游戏能正确获取你的公网 IP
    # 如果走 Fake-IP，这些应用可能会获取到 198.18.x.x，导致连接失败或 NAT 类型严格
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stun.*.*.*.*"
  use-hosts: false     #如有特殊需求请设为true
  use-system-hosts: true     #如有特殊需求请设为true
  nameserver:   #没有命中其他特定策略的兜底解析
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  proxy-server-nameserver:   #解析代理服务器（机场节点）本身的域名，必须直连
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
  direct-nameserver:   #直连时专门用于国内直连域名的解析
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
  respect-rules: true
sniffer:
  enable: true
  parse-pure-ip: true  # 对纯 IP 请求也进行嗅探（强制重置目标为域名）
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080, 8880]
      override-destination: true
  # [新增] 强制跳过嗅探的域名列表，这里主要填一些不需要或不能被嗅探的域名，防止日志报错
  skip-domain:
 # 1. 沉默的推送服务 & 智能家居 (解决报错)
    - "+.push.apple.com"
    - "+.push.xiaomi.com"
    - "+.push.huawei.com"
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    
    # 2. 腾讯系长连接 (解决你刚才的 150.x.x.x 报错)
    - "+.qq.com"
    - "+.tencent.com"
    
    # 3. 性能优化 & 乱七八糟的苹果服务
    - "+.apple.com"
    - "+.icloud.com"
    - "+.itunes.com"
    
    # 4. 游戏 (如果有玩)
    - "+.steamcontent.com"
# ==============================
# 0. 全局配置模板 (定义锚点)
# ==============================
common-config:
  # 模板1: 时延优选 (自动选择)
  - &auto
    type: url-test
    url: 'http://www.gstatic.com/generate_204'
    interval: 600
    tolerance: 50
    timeout: 5000
    lazy: true
    expected-status: 204
    hidden: true
    include-all: true
  
  # 模板2: 故障转移
  - &fallback
    type: fallback
    url: 'http://www.gstatic.com/generate_204'
    interval: 600
    timeout: 3000
    lazy: true
    expected-status: 204
    hidden: true
    include-all: true

  # 模板3: 负载均衡
  - &lb
    type: load-balance
    strategy: consistent-hashing  #round-robin (轮询/极速模式)第1个请求走节点A，第2个走节点B。consistent-hashing对目标域名（如 google.com）进行哈希计算。只要你访问的是 google.com，它就固定分配给节点 A。
    url: 'http://www.gstatic.com/generate_204'
    interval: 600
    timeout: 5000
    lazy: true
    expected-status: 204
    hidden: true
    include-all: true

  # 规则集模板1: 经典模式、YAML格式、一天一更
  - &p-standard
    type: http
    behavior: classical
    format: yaml
    interval: 86400
  # 规则集模板2: IPCIDR 模式、YAML格式、一天一更
  - &p-ip
    type: http
    behavior: ipcidr
    format: yaml
    interval: 86400
# 规则集模板3.1: MRS domain二进制格式
  - &p-mrs
    type: http
    format: mrs
    interval: 86400
    behavior: domain
# 规则集模板3.2: MRS ipcidr 二进制格式
  - &p-mrsip
    type: http
    format: mrs
    interval: 86400
    behavior: ipcidr 
