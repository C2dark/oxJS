proxy-groups:
#分流分组
  - {name: 手动切换, type: select, include-all: true, icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Static.png }
  - {name: Global, type: select, proxies: [手动切换, DIRECT, 自动选择, 香港策略, 日本策略, 台湾策略, 美国策略, 狮城策略], icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Global.png }
  - {name: Telegram, type: select, proxies: [手动切换, DIRECT, 自动选择, 香港策略, 日本策略, 台湾策略, 美国策略, 狮城策略], icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Telegram.png }
  - {name: YouTube,   type: select, proxies: [美国策略, 手动切换], icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png }
  - {name: TikTok,   type: select, proxies: [美国策略, 手动切换], icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/TikTok.png }
  - {name: Facebook,   type: select, proxies: [美国策略, 手动切换], icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Facebook.png }
  - {name: Google, type: select, proxies: [手动切换, DIRECT, 自动选择, 香港策略, 日本策略, 台湾策略, 美国策略, 狮城策略], icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Google.png }
  - {name: Microsoft, type: select, proxies: [手动切换, DIRECT, 自动选择, 香港策略, 日本策略, 台湾策略, 美国策略, 狮城策略], icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Microsoft.png }
  - {name: Bing, type: select, proxies: [手动切换, DIRECT, 自动选择, 香港策略, 日本策略, 台湾策略, 美国策略, 狮城策略], icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Bing.png }
  - {name: Apple, type: select, proxies: [DIRECT, 手动切换, 自动选择, 香港策略, 日本策略, 台湾策略, 美国策略, 狮城策略], icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple.png }
  - {name: Netflix, type: select, proxies: [DIRECT, 香港策略, 台湾策略, 狮城策略], icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Netflix.png }
  - {name: Emby, type: select, proxies: [手动切换, DIRECT, 自动选择, 香港策略, 日本策略, 台湾策略, 美国策略, 狮城策略], icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Emby.png }
  - {name: GlobalDL, type: select, proxies: [手动切换, DIRECT, 自动选择, 香港策略, 日本策略, 台湾策略, 美国策略, 狮城策略], icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Global.png }
  - {name: AdBlock,  type: select, proxies: [REJECT, DIRECT], icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Adblock.png }
  - {name: 兜底分流, type: select, proxies: [手动切换, DIRECT, 自动选择, 香港策略, 日本策略, 台湾策略, 美国策略, 狮城策略], icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Final.png }
  
#节点分组
  - {name: 自动选择, type: url-test, include-all: true, interval: 600, tolerance: 50,  icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Urltest.png }
  - {name: 美国策略, type: url-test, include-all: true, interval: 600, tolerance: 50,  filter: "美|US|(?i)States|American", icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/US.png }
  - {name: 香港策略, type: url-test, include-all: true, interval: 600, tolerance: 50,  filter: "港|HK|(?i)Hong", icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/HK.png }
  - {name: 狮城策略, type: url-test, include-all: true, interval: 600, tolerance: 50,  filter: "新|坡|SG|(?i)Singapore", icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/SG.png }             
  - {name: 日本策略, type: url-test, include-all: true, interval: 600, tolerance: 50,  filter: "日|东京|JP|(?i)Japan", icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/JP.png }
  - {name: 台湾策略, type: url-test, include-all: true, interval: 600, tolerance: 50,  filter: "台|湾|TW|(?i)Taiwan", icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/TW.png }
  

