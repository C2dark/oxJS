#override_V2.0
#2025.12.23 更新
dns:
  enable: true
  ipv6: true      #如网络环境不支持IPv6请设为false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:     #使用geosite域名集合以精简配置，也可使用规则集（ruleset）
    - geosite:private
    - geosite:category-ntp
  use-hosts: false     #如有特殊需求请设为true
  use-system-hosts: true     #如有特殊需求请设为true
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
  respect-rules: true
# ==============================
# 0. 全局配置模板 (定义锚点)
# ==============================
common-config:
  # 模板1: 时延优选 (自动选择)
  - &auto
    type: url-test
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50
    lazy: true
    expected-status: 204
    hidden: true
    include-all: true
  
  # 模板2: 故障转移
  - &fallback
    type: fallback
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    lazy: true
    expected-status: 204
    hidden: true
    include-all: true

  # 模板3: 负载均衡
  - &lb
    type: load-balance
    strategy: consistent-hashing
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    lazy: true
    expected-status: 204
    hidden: true
    include-all: true

  # 规则集模板: 经典模式、YAML格式、一天一更
  - &p-standard
    type: http
    behavior: classical
    format: yaml
    interval: 86400
  # 规则集模板: IPCIDR 模式、YAML格式、一天一更
  - &p-ip
    type: http
    behavior: ipcidr
    format: yaml
    interval: 86400
